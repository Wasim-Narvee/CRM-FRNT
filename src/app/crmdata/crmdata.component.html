<mat-toolbar color="primary" class="portal-toolbar">
  <span class="portal-title">CRM</span>
</mat-toolbar>

<div class="page-container">

  <!-- ACTION ROW -->
  <div class="action-row">

    <button mat-raised-button color="primary" (click)="openAddDialog()" class="add-btn">
      + Add Company
    </button>

    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search Customer">
    </mat-form-field>

  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(102, 102, 248); color: aliceblue;"> Name </th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(102, 102, 248); color: aliceblue;"> Email </th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>

      <!-- Phone No -->
      <ng-container matColumnDef="phoneNo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(102, 102, 248); color: aliceblue;"> Phone </th>
        <td mat-cell *matCellDef="let element">{{ element.phoneNo }}</td>
      </ng-container>

      <!-- Website -->
      <ng-container matColumnDef="websiteUrl">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(102, 102, 248); color: aliceblue;"> Website </th>
        <td mat-cell *matCellDef="let element">{{ element.websiteUrl }}</td>
      </ng-container>

      <!-- Country -->
      <ng-container matColumnDef="country">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: rgb(102, 102, 248); color: aliceblue;"> Country </th>
        <td mat-cell *matCellDef="let element">{{ element.country }}</td>
      </ng-container>

      <!-- Address -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef mat-sort-header  style="background-color: rgb(102, 102, 248); color: aliceblue;"> Address </th>
        <td mat-cell *matCellDef="let element">{{ element.address }}</td>
      </ng-container>

      <!-- ACTIONS -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef  style="background-color: rgb(102, 102, 248); color: aliceblue;"> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="accent" (click)="editCustomer(element)">
            <mat-icon>edit</mat-icon>
          </button>

<button mat-icon-button color="warn" (click)="deleteCustomer(element.id)">

            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- ROWS -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>

</div>
